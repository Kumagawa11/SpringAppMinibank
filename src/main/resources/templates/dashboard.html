<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
</head>

<body>

    <section layout:fragment="content">

        <h3>
            ようこそ <span th:text="${username}"></span>さん
        </h3>
        
        <p th:if="${errorMsg}" th:text="${errorMsg}"></p>

        <h4>
            <p>残高</p>
            <span th:text="${balance}"></span>
        </h4>

        <div th:each="user : ${userList}">
            <div th:text="${user}"></div>
        </div>

        <div>
            <a th:href="@{/deposit}">入金</a>
        </div>
        <div>
            <a th:href="@{/withdrawal}">出金</a>
        </div>
        <div>
            <a th:href="@{/transfer}">送金</a>
        </div>
        <div>
            <a th:href="@{/history}">入出金履歴</a>
        </div>
        <br>
        <div>
            <form th:action="@{/logout}" method="post">
                <input type="submit" value="ログアウト">
            </form>
        </div>
    </section>


</body>

</html>
